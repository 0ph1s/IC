\* Política do projeto SEM a propriedade NoPermanentBlindness. O TLC para na primeira violação; esta configuração
\* confirma que TODAS as demais propriedades valem com OneSlot. Esperado: nenhuma violação (código de saída 0).
SPECIFICATION Spec
CONSTANT Policy = "OneSlot"
INVARIANT TypeOK
INVARIANT QueueBounded
PROPERTY NoDirectInFlightShutdown
PROPERTY ShutdownOnlyFromGrounded
PROPERTY EmergencyOnlyFromFlight
PROPERTY EventDestination
PROPERTY LoopTerminates
