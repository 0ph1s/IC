\* Política do projeto. Esperado no TLC:
\*   todas as propriedades valem, EXCETO NoPermanentBlindness (contraexemplo: Drain, Drain, TakeoffSignal e ticks ociosos).
SPECIFICATION Spec
CONSTANT Policy = "OneSlot"
INVARIANT TypeOK
INVARIANT QueueBounded
PROPERTY NoDirectInFlightShutdown
PROPERTY ShutdownOnlyFromGrounded
PROPERTY EmergencyOnlyFromFlight
PROPERTY EventDestination
PROPERTY LoopTerminates
PROPERTY NoPermanentBlindness
